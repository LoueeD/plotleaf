name: Verify Plotleaf website

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "src/**",
        "scripts/build.ts",
        "package.json",
        "bun.lock",
        "examples/**",
        "skills/plotleaf/SKILL.md",
        "schema/components.json",
        ".github/workflows/site.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "src/**",
        "scripts/build.ts",
        "package.json",
        "bun.lock",
        "examples/**",
        "skills/plotleaf/SKILL.md",
        "schema/components.json",
        ".github/workflows/site.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bunx wrangler deploy --dry-run
      - run: node ../node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - run: bun run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-browser-results
          path: site/test-results/
          if-no-files-found: ignore
